version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rideprofit-postgres
    environment:
      POSTGRES_DB: rideprofit
      POSTGRES_USER: rideprofit
      POSTGRES_PASSWORD: rideprofit
    ports:
      - "5432:5432"
    volumes:
      - rideprofit-postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rideprofit-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rideprofit
      DB_USER: rideprofit
      DB_PASSWORD: rideprofit
      JWT_SECRET: your-strong-random-jwt-secret-here-change-in-production
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  rideprofit-postgres-data:
