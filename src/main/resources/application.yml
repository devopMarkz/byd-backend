spring:
  application:
    name: ride-profit-backend

  profiles:
    active: prod

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    context-path: /api

app:
  timezone: America/Sao_Paulo
